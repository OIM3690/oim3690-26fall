<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart Discount</title>
</head>
<body>
  <h1>Cart Discount</h1>

  <form id="discountForm">
    <label>
      Cart total ($):
      <input type="number" id="total" min="0" step="0.01" required>
    </label>
    <br><br>
    <label>
      <input type="checkbox" id="isMember"> Member
    </label>
    <br><br>
    <button type="submit">Calculate Discount</button>
  </form>

  <p id="result"></p>

  <script>
    function getDiscount(total, isMember) {
      // total >= 100 AND a member -> 20
      // total >= 100 OR  a member -> 10
      // otherwise                 -> 0
    }

    document.getElementById("discountForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const total = parseFloat(document.getElementById("total").value);
      const isMember = document.getElementById("isMember").checked;
      const discount = getDiscount(total, isMember);
      document.getElementById("result").textContent = "Discount: " + discount + "%";
    });
  </script>
</body>
</html>
